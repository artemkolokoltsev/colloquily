name: Build desktop artifacts (manual, unsigned)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'frontend/**'
      - 'tests/**'
      - 'src-tauri/**'
      - '.github/workflows/desktop.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: npm run build
      - run: npm run build:sidecar
      - run: python scripts/smoke_sidecar.py
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --config src-tauri/tauri.unsigned.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - run: python scripts/checksums.py src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: colloquily-${{ matrix.target }}-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

