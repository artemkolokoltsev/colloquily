name: Build desktop artifacts (manual, unsigned)
on:
  workflow_dispatch:
  push:
    tags: ['v*-rc.*']
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'frontend/**'
      - 'tests/**'
      - 'src-tauri/**'
      - '.github/workflows/desktop.yml'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  learning-acceptance:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    uses: ./.github/workflows/learning-quality.yml

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: python scripts/test_core.py
      - run: npm run build
      - run: npm run build:sidecar
      - run: python scripts/smoke_sidecar.py
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --config src-tauri/tauri.unsigned.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - run: python scripts/checksums.py src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: colloquily-${{ matrix.target }}-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: licenses-${{ matrix.target }}
          path: build/release-notices/
          if-no-files-found: error

  publish-preview:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    needs: [desktop, learning-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: colloquily-*-unsigned
          path: release-assets/installers
      - uses: actions/download-artifact@v8
        with:
          pattern: licenses-*
          path: release-assets/licenses
      - name: Publish unsigned release candidate with license bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_preview.py

