name: Build desktop previews (signed updates)
on:
  workflow_dispatch:
  push:
    tags: ['v*-rc.*']
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'frontend/**'
      - 'tests/**'
      - 'src-tauri/**'
      - '.github/workflows/desktop.yml'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pdf-reader:
    uses: ./.github/workflows/pdf-reader.yml

  learning-acceptance:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    uses: ./.github/workflows/learning-quality.yml

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      COLLOQUILY_CODESIGN_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
      WINDOWS_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Require updater signing for published previews
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/configure_release_key.mjs "$UPDATER_PUBLIC_KEY"
      - name: Check native signing credentials
        id: native-signing
        run: python scripts/signing_preflight.py
      - name: Import Developer ID
        if: runner.os == 'macOS' && steps.native-signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Configure Windows publisher signature
        if: runner.os == 'Windows' && steps.native-signing.outputs.enabled == 'true'
        run: ./scripts/configure_windows_signing.ps1
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: python scripts/test_core.py
      - run: npm run build
      - run: npm run build:sidecar
      - run: python scripts/smoke_sidecar.py
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build updater-signed preview
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Build local unsigned artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri -- build --config src-tauri/tauri.unsigned.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify native trust before publication
        if: steps.native-signing.outputs.enabled == 'true'
        run: python scripts/verify_native_signing.py src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }} --required
      - name: Label OS-unsigned preview honestly
        if: steps.native-signing.outputs.enabled != 'true'
        run: python scripts/verify_native_signing.py src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - run: python scripts/checksums.py src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: colloquily-${{ matrix.target }}-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: licenses-${{ matrix.target }}
          path: build/release-notices/
          if-no-files-found: error

  publish-preview:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    needs: [desktop, learning-acceptance, pdf-reader]
    runs-on: ubuntu-latest
    concurrency:
      group: colloquily-download-channel
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: colloquily-*-unsigned
          path: release-assets/installers
      - uses: actions/download-artifact@v8
        with:
          pattern: licenses-*
          path: release-assets/licenses
      - name: Publish preview with signed updates and permanent downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_preview.py

