name: Refresh permanent download links
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag to promote (for example v0.1.6-rc.1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    concurrency:
      group: colloquily-download-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Promote verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python scripts/publish_channel.py "$RELEASE_TAG"
