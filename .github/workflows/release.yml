name: Publish signed desktop release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  pdf-reader:
    uses: ./.github/workflows/pdf-reader.yml

  release:
    needs: pdf-reader
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      COLLOQUILY_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Require release credentials
        shell: bash
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi
          node scripts/configure_release_key.mjs "$UPDATER_PUBLIC_KEY"
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - name: Configure Windows Authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/configure_windows_signing.ps1
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Import Developer ID before signing Python libraries
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: python scripts/test_core.py
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:sidecar
      - run: python scripts/smoke_sidecar.py
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Colloquily ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          assetNamePattern: "Colloquily_[version]_[arch][setup][ext]"
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify signed installer and Mac notarization
        run: python scripts/verify_native_signing.py src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }} --required
      - run: python scripts/checksums.py src-tauri/target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: signed-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: licenses-${{ matrix.target }}
          path: build/release-notices/
          if-no-files-found: error

  finalize-draft:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: signed-*
          path: release-assets/installers
      - uses: actions/download-artifact@v8
        with:
          pattern: licenses-*
          path: release-assets/licenses
      - name: Attach complete update feed, checksums and notices to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLOQUILY_STABLE_RELEASE: '1'
        run: python scripts/publish_preview.py
