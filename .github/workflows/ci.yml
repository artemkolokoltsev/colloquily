name: Verify desktop
on:
  pull_request:
  push:
    branches: [main, release-v0.1.0]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: npm run build
      - run: npm run build:sidecar
      - run: python scripts/smoke_sidecar.py
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: python scripts/test_core.py

