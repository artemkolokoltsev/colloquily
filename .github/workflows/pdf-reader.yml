name: Packaged PDF reader regression
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/smoke_pdf_reader.mjs'
      - 'scripts/smoke_coursework.mjs'
      - 'backend/**'
      - 'tests/frontend/fixtures/**'
      - 'src-tauri/tauri.conf.json'
      - 'package*.json'
      - '.github/workflows/pdf-reader.yml'
permissions:
  contents: read
concurrency:
  group: pdf-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:pdf

  coursework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: '3.11', cache: pip }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '22', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Verify real exercise API, local PDF export, draft recovery and script updates
        env:
          COLLOQUILY_TEST_PYTHON: python
        run: node scripts/smoke_coursework.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coursework-verification
          path: |
            output/playwright/
            output/pdf/
          if-no-files-found: ignore
