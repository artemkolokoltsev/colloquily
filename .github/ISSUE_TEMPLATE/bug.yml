name: Bug report
description: Report a reproducible problem using sanitized information.
body:
  - type: markdown
    attributes:
      value: Do not attach course documents, answers, databases, tokens or raw logs. Report vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes: { label: App version and OS/architecture, placeholder: '0.1.10 preview, macOS Intel' }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Steps to reproduce with synthetic material }
    validations: { required: true }
  - type: textarea
    id: result
    attributes: { label: Expected and actual result, description: Include a sanitized error message or screenshot if useful. }
    validations: { required: true }
