services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LANGTRACE_POSTGRES_DB}
      POSTGRES_USER: ${LANGTRACE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGTRACE_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGTRACE_POSTGRES_USER} -d ${LANGTRACE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - langtrace_postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${LANGTRACE_CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${LANGTRACE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGTRACE_CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - langtrace_clickhouse_data:/var/lib/clickhouse
      - ./docker/langtrace/clickhouse/init:/docker-entrypoint-initdb.d:ro

  langtrace:
    image: scale3labs/langtrace-client:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGTRACE_NEXTAUTH_SECRET}
      NEXT_PUBLIC_HOST: ${LANGTRACE_PUBLIC_HOST}
      ADMIN_EMAIL: ${LANGTRACE_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${LANGTRACE_ADMIN_PASSWORD}
      NEXT_PUBLIC_ENABLE_ADMIN_LOGIN: ${LANGTRACE_ENABLE_ADMIN_LOGIN}
      DATABASE_URL: postgresql://${LANGTRACE_POSTGRES_USER}:${LANGTRACE_POSTGRES_PASSWORD}@postgres:5432/${LANGTRACE_POSTGRES_DB}?schema=public
      POSTGRES_URL: postgresql://${LANGTRACE_POSTGRES_USER}:${LANGTRACE_POSTGRES_PASSWORD}@postgres:5432/${LANGTRACE_POSTGRES_DB}?schema=public
      POSTGRES_PRISMA_URL: postgresql://${LANGTRACE_POSTGRES_USER}:${LANGTRACE_POSTGRES_PASSWORD}@postgres:5432/${LANGTRACE_POSTGRES_DB}?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://${LANGTRACE_POSTGRES_USER}:${LANGTRACE_POSTGRES_PASSWORD}@postgres:5432/${LANGTRACE_POSTGRES_DB}?schema=public
      CLICKHOUSE_URL: http://clickhouse:8123/${LANGTRACE_CLICKHOUSE_DB}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${LANGTRACE_CLICKHOUSE_DB}
      CLICKHOUSE_DATABASE: ${LANGTRACE_CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${LANGTRACE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGTRACE_CLICKHOUSE_PASSWORD}
      CLICK_HOUSE_HOST: http://clickhouse:8123
      CLICK_HOUSE_USER: ${LANGTRACE_CLICKHOUSE_USER}
      CLICK_HOUSE_PASSWORD: ${LANGTRACE_CLICKHOUSE_PASSWORD}
      CLICK_HOUSE_DATABASE_NAME: ${LANGTRACE_CLICKHOUSE_DB}
    command: npm start
    ports:
      - "3000:3000"

volumes:
  langtrace_postgres_data:
  langtrace_clickhouse_data:
